[project]
name = "event-payment-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "alembic-postgresql-enum>=1.10.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "faststream[cli,rabbit]>=0.7.7",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
